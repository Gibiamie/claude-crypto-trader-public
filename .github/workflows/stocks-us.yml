name: US Stocks Tick

on:
  schedule:
    # Geniş UTC pencere; Python NY timezone ile gerçek seans saatini filtreler.
    - cron: '35 13-22 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stocks-us
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testleri çalıştır
        run: python3 -m unittest discover -s tests -v

      - name: US paper tick
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 -u -m stocks.tick --market us --force
          else
            python3 -u -m stocks.tick --market us
          fi

      - name: US journal/state commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d stock_journal/us ]; then git add -f stock_journal/us; fi
          if [ -d stock_state/us ]; then git add -f stock_state/us; fi
          git diff --staged --quiet || git commit -m "us tick: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
