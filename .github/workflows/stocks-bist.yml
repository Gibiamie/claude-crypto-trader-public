name: BIST Stocks Tick

on:
  schedule:
    # Türkiye UTC+3; 07:20-15:20 UTC aralığı. Python gerçek seans saatini filtreler.
    - cron: '20 7-15 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stocks-bist
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Testleri çalıştır
        run: python3 -m unittest discover -s tests -v

      - name: BIST paper tick
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 -u -m stocks.tick --market bist --force
          else
            python3 -u -m stocks.tick --market bist
          fi

      - name: BIST journal/state commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d stock_journal/bist ]; then git add -f stock_journal/bist; fi
          if [ -d stock_state/bist ]; then git add -f stock_state/bist; fi
          git diff --staged --quiet || git commit -m "bist tick: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
