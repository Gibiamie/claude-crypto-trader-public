name: Hourly Tick

on:
  schedule:
    - cron: '17 * * * *'   # saat başı yoğunluğundan uzak; GitHub gecikebilir
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-data-writer
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Core testleri çalıştır
        run: python3 -m unittest discover -s tests -v

      - name: Tick'i çalıştır
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python3 -u tick.py

      - name: Journal ve state değişikliklerini commit'le
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f journal/*.jsonl
          if [ -d state ]; then git add -f state; fi
          git diff --staged --quiet || git commit -m "tick: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
