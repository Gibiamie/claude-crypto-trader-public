name: Hourly Tick

on:
  schedule:
    - cron: '0 * * * *'   # her saat başı (UTC) — GitHub birkaç dakika gecikebilir
  workflow_dispatch: {}    # Actions sekmesinden elle de tetiklenebilir

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tick'i çalıştır
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python3 -u tick.py

      - name: journal/ değişikliklerini commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f journal/*.jsonl
          git diff --staged --quiet || git commit -m "tick: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
